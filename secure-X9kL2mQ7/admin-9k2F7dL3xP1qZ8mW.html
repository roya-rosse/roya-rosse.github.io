<!DOCTYPE html>
<html lang="ar" dir="rtl">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>

        body { background: #FFF5F7; padding: 1rem; direction: rtl; font-family: 'Tajawal', sans-serif; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 30px; padding: 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 2px solid #FFE4E8; }
        h1 { color: #FF9AAE; font-size: 1.8rem; display: flex; align-items: center; gap: 10px; }
        .logout-btn { background: linear-gradient(135deg, #D58B9A, #E09DAE); color: white; border: none; padding: 8px 20px; border-radius: 40px; font-size: 0.9rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .logout-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(213,139,154,0.3); }
        .section { background: white; border: 1px solid #FFE4E8; border-radius: 25px; margin-bottom: 1.5rem; overflow: hidden; }
        .section-header { background: #FFF5F7; padding: 1rem 1.5rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #5E4B56; transition: 0.2s; }

        .section-content { padding: 1.5rem; display: none; border-top: 1px solid #FFE4E8; }
        .section-content.open { display: block; }
        .btn { border: none; padding: 8px 18px; border-radius: 40px; font-weight: bold; font-size: 0.8rem; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px; font-family: 'Tajawal', sans-serif; }
        .btn-primary { background: linear-gradient(135deg, #FF9AAE, #FFB3C6); color: #5E4B56; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,154,174,0.3); }
        .btn-secondary { background: #E8E8E8; color: #5E4B56; }
        .btn-secondary:hover { background: #DDDDDD; }
        .btn-danger { background: linear-gradient(135deg, #D58B9A, #E09DAE); color: white; }
        .btn-danger:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(213,139,154,0.3); }
        .btn-sm { padding: 5px 12px; font-size: 0.7rem; }
        .btn-block { width: 100%; justify-content: center; }
        .category-card { background: #FEFEFE; border-radius: 20px; padding: 1rem; margin-bottom: 1rem; border: 1px solid #FFE4E8; transition: 0.2s; }
        .category-card:hover { border-color: #FF9AAE; box-shadow: 0 2px 10px rgba(255,154,174,0.1); }
        .category-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 0.8rem; }
        .category-info { display: flex; align-items: center; gap: 0.8rem; }

        .edit-category-form { background: #FFF5F7; padding: 1rem; border-radius: 18px; margin: 0.8rem 0; display: none; }
        .edit-category-form.open { display: block; }
        .toggle-products-btn { background: none; border: none; color: #FF9AAE; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 0.5rem 0; margin-top: 0.5rem; }
        .category-products-area { margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed #FFE4E8; display: none; }
        .category-products-area.open { display: block; }
        .form-group { margin-bottom: 1rem; }
        input, textarea, select { width: 100%; padding: 10px 15px; border: 1px solid #FFE4E8; border-radius: 30px; font-family: inherit; font-size: 0.9rem; transition: 0.2s; }
        input:focus, textarea:focus { outline: none; border-color: #FF9AAE; box-shadow: 0 0 0 2px rgba(255,154,174,0.2); }
        .file-upload-btn { background: #F0F0F0; padding: 10px 20px; border-radius: 40px; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; font-size: 0.85rem; transition: 0.2s; border: 1px solid #FFE4E8; }
        .file-upload-btn:hover { background: #FFE4E8; border-color: #FF9AAE; }
        .product-item { background: #FEFEFE; border-radius: 18px; padding: 0.8rem; margin-bottom: 0.8rem; border: 1px solid #FFE4E8; }
        .badge { font-size: 0.7rem; padding: 3px 12px; border-radius: 30px; background: #FFE4E8; display: inline-block; }
        .badge-active { background: #A8E6CF; color: #1B4332; }
        .badge-inactive { background: #D58B9A; color: white; }
        .product-date { font-size: 0.7rem; color: #A89B9F; margin-top: 5px; }
        .stats-badge { background: #FF9AAE20; display: inline-block; padding: 6px 15px; border-radius: 40px; font-size: 0.85rem; margin-bottom: 1rem; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem; }
        .flex-start { display: flex; align-items: center; flex-wrap: wrap; gap: 0.8rem; }
        .mt-2 { margin-top: 0.8rem; }
        .search-box { display: flex; align-items: center; background: #F9F9F9; border: 1px solid #FFE4E8; border-radius: 50px; padding: 5px 18px; margin-bottom: 1rem; }
        .search-box i { color: #FF9AAE; margin-left: 10px; }
        .search-box input { border: none; background: transparent; padding: 10px 0; margin: 0; }
        #adminToast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #A8E6CF; color: #1B4332; padding: 10px 25px; border-radius: 50px; font-size: 0.85rem; z-index: 10000; opacity: 0; transition: opacity 0.3s; pointer-events: none; font-weight: bold; }

        @media (max-width: 600px) { .container { padding: 1rem; } .category-header { flex-direction: column; align-items: flex-start; } .btn { padding: 6px 12px; font-size: 0.7rem; } }
    </style>
</head>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD6CcJDUiXgCQxe_aL_j2aEi1nuQ2X2o5s",
        authDomain: "enath-7d5e8.firebaseapp.com",
        databaseURL: "https://enath-7d5e8-default-rtdb.firebaseio.com",
        projectId: "enath-7d5e8",
        storageBucket: "enath-7d5e8.firebasestorage.app",
        messagingSenderId: "101026768739",
        appId: "1:101026768739:web:c3635b04e972914a5b1556"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUserRole = 'admin';
    let ads = [], categories = [], products = [];
    let lastSearchText = "";
    let tempProductImageFile = {}, tempEditCatFile = null, tempEditAdFile = null, tempEditProductFile = {};

    function showToast(msg, isError = false) {
        const t = document.getElementById('adminToast');
        t.innerText = msg;
        if (isError) t.classList.add('error');
        else t.classList.remove('error');
        t.style.opacity = '1';
        setTimeout(() => t.style.opacity = '0', 2500);
    }
    function generateProductCode() { return 'ROY' + Math.random().toString(36).substring(2, 10).toUpperCase(); }
    function formatDate(ts) { if (!ts) return "📅 غير معروف"; const d = new Date(ts); return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`; }
    function escapeHtml(s) { if (!s) return ''; return s.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
    function toggleSection(id) { document.getElementById(id).classList.toggle('open'); }

    // Cloudinary
    const CLOUD_NAME = "dh6j108wj", UPLOAD_PRESET = "roya-shop";
    async function compressImage(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    const maxSize = 1200;
                    if (width > height && width > maxSize) { height = (height * maxSize) / width; width = maxSize; }
                    else if (height > maxSize) { width = (width * maxSize) / height; height = maxSize; }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.6);
                };
                img.onerror = reject;
            };
            reader.onerror = reject;
        });
    }
    async function uploadImageToCloudinary(file) {
        const compressed = await compressImage(file);
        const formData = new FormData();
        formData.append('file', compressed);
        formData.append('upload_preset', UPLOAD_PRESET);
        const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`);
        try {
            const response = await fetch(proxyUrl, { method: 'POST', body: formData });
            if (!response.ok) throw new Error('Proxy failed');
            const data = await response.json();
            return data.secure_url;
        } catch (err) {
            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`, { method: 'POST', body: formData });
            if (!response.ok) throw new Error('Direct upload failed');
            const data = await response.json();
            return data.secure_url;
        }
    }

    async function saveAll(keepSectionId = null) {
        try {
            if (currentUserRole === 'super') {
                const adsObj = {};
                ads.forEach(a => { adsObj[a.id] = { image: a.image, text: a.text, active: a.active }; });
                await db.ref('ads').set(adsObj);
            }
            const catsObj = {};
            categories.forEach(c => { catsObj[c.id] = { name: c.name, image: c.image, active: c.active }; });
            await db.ref('categories').set(catsObj);
            const prodsObj = {};
            products.forEach(p => { prodsObj[p.id] = { name: p.name, price: p.price, oldprice: p.oldprice || '', desc: p.desc || '', image: p.image, categoryId: p.categoryId, code: p.code || generateProductCode(), active: p.active, createdAt: p.createdAt || null }; });
            await db.ref('products').set(prodsObj);
            renderAll();
            if (keepSectionId) document.getElementById(keepSectionId)?.classList.add('open');
            if (window.updateStoreData) window.updateStoreData();
        } catch (err) { console.error(err); showToast("حفظ البيانات فشل: "+err.message, true); }
    }

    function renderAds() {
        const container = document.getElementById('adsList');
        if (!container) return;
        container.innerHTML = ads.map(ad => `
            <div class="category-card">
                <div class="flex-between"><img src="${ad.image}" width="50"><span class="badge ${ad.active?'badge-active':'badge-inactive'}">${ad.active?'نشط':'مخفي'}</span></div>
                <p>${ad.text||''}</p>
                <div class="flex-start mt-2">
                    <button class="btn btn-primary btn-sm" onclick="toggleAd('${ad.id}')"><i class="fas fa-eye${ad.active?'-slash':''}"></i> ${ad.active?'إخفاء':'إظهار'}</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteAd('${ad.id}')"><i class="fas fa-trash"></i> حذف</button>
                    <button class="btn btn-secondary btn-sm" onclick="showEditAd('${ad.id}')"><i class="fas fa-edit"></i> تعديل</button>
                </div>
                <div id="editAd_${ad.id}" style="display:none; margin-top:12px; background:#FFF5F7; padding:12px; border-radius:18px;">
                    <div class="file-upload-btn" onclick="document.getElementById('editAdFile_${ad.id}').click()"><i class="fas fa-cloud-upload-alt"></i> تغيير الصورة</div>
                    <input type="file" id="editAdFile_${ad.id}" style="display:none">
                    <input type="text" id="editAdTxt_${ad.id}" value="${ad.text||''}">
                    <div class="flex-start mt-2"><button class="btn btn-primary btn-sm" onclick="updateAdImage('${ad.id}')">حفظ الصورة</button><button class="btn btn-primary btn-sm" onclick="updateAdText('${ad.id}')">حفظ النص</button></div>
                </div>
            </div>
        `).join('');
        ads.forEach(ad => { const fi = document.getElementById(`editAdFile_${ad.id}`); if(fi) fi.onchange = (e) => { tempEditAdFile = e.target.files[0]; showToast("تم اختيار صورة جديدة"); }; });
    }

    function renderCategories() {
        const container = document.getElementById('categoriesList');
        if (!container) return;
        container.innerHTML = categories.map(cat => `
            <div class="category-card">
                <div class="category-header">
                    <div class="category-info"><img src="${cat.image}"><h3>${escapeHtml(cat.name)}</h3><span class="badge ${cat.active?'badge-active':'badge-inactive'}">${cat.active?'نشط':'مخفي'}</span></div>
                    <div class="category-buttons">
                        <button class="btn btn-secondary btn-sm" onclick="openEditCatForm('${cat.id}')"><i class="fas fa-edit"></i> تعديل</button>
                        <button class="btn btn-primary btn-sm" onclick="toggleCategory('${cat.id}')"><i class="fas fa-eye${cat.active?'-slash':''}"></i> ${cat.active?'إخفاء':'إظهار'}</button>

                    </div>
                </div>
                <div id="editCatForm_${cat.id}" class="edit-category-form">
                    <input type="text" id="editCatName_${cat.id}" value="${cat.name}">
                    <div class="file-upload-btn" onclick="document.getElementById('editCatFile_${cat.id}').click()"><i class="fas fa-cloud-upload-alt"></i> تغيير الصورة</div>
                    <input type="file" id="editCatFile_${cat.id}" style="display:none">
                    <div class="flex-start mt-2"><button class="btn btn-primary btn-sm" onclick="updateCategory('${cat.id}')">حفظ</button><button class="btn btn-secondary btn-sm" onclick="closeEditCatForm('${cat.id}')">إلغاء</button></div>
                </div>
                <div class="toggle-products-btn" onclick="toggleCatProducts('${cat.id}')"><i class="fas fa-chevron-down" id="toggleIcon_${cat.id}"></i> عرض المنتجات (${products.filter(p=>p.categoryId===cat.id).length})</div>
                <div id="catProducts_${cat.id}" class="category-products-area">
                    <div class="add-product-form" style="background:#FFF5F7; padding:1rem; border-radius:20px; margin-bottom:1rem;">
                        <h4>➕ إضافة منتج جديد</h4>
                        <input type="text" id="prodName_${cat.id}" placeholder="اسم المنتج">
                        <input type="text" id="prodPrice_${cat.id}" placeholder="السعر $">
                        <input type="text" id="prodOld_${cat.id}" placeholder="السعر قبل الخصم">
                        <textarea id="prodDesc_${cat.id}" rows="2" placeholder="الوصف"></textarea>
                        <div class="file-upload-btn" onclick="document.getElementById('prodImgFile_${cat.id}').click()"><i class="fas fa-cloud-upload-alt"></i> اختيار صورة</div>
                        <input type="file" id="prodImgFile_${cat.id}" style="display:none">
                        <div id="prodFileName_${cat.id}" style="font-size:0.7rem;">📷 لم يتم اختيار ملف</div>

                    <div id="prodsList_${cat.id}">${products.filter(p=>p.categoryId===cat.id).map(p => `

                            <div class="product-date"><i class="far fa-clock"></i> ${formatDate(p.createdAt)}</div>
                            <div class="flex-start mt-2"><button class="btn btn-secondary btn-sm" onclick="editProduct('${p.id}')">تعديل</button><button class="btn btn-primary btn-sm" onclick="toggleProduct('${p.id}')"><i class="fas fa-eye${p.active?'-slash':''}"></i> ${p.active?'إخفاء':'إظهار'}</button><button class="btn btn-danger btn-sm" onclick="deleteProduct('${p.id}')">حذف</button></div>
                            <div id="editForm_${p.id}" style="display:none; margin-top:12px; background:#FFF5F7; padding:12px; border-radius:18px;">
                                <div class="file-upload-btn" onclick="document.getElementById('editImgFile_${p.id}').click()"><i class="fas fa-cloud-upload-alt"></i> تغيير الصورة</div><input type="file" id="editImgFile_${p.id}" style="display:none">

        const catsMap = Object.fromEntries(categories.map(c=>[c.id,c.name]));
        let filtered = products;
        if(lastSearchText && lastSearchText.trim()){
            const lower = lastSearchText.toLowerCase();
            filtered = products.filter(p=>p.name.toLowerCase().includes(lower) || (p.code && p.code.toLowerCase().includes(lower)));
        }
        statsSpan.innerHTML = `📦 إجمالي المنتجات: ${filtered.length}`;
        if(filtered.length===0){ container.innerHTML='<div class="category-card" style="text-align:center;">لا توجد منتجات</div>'; return; }
        container.innerHTML = filtered.map(p=>`
            <div class="category-card">
                <div class="flex-between"><div class="flex-start"><img src="${p.image}" width="40"><strong>${escapeHtml(p.name)}</strong> - ${p.price}$</div><span class="badge ${p.active?'badge-active':'badge-inactive'}">${p.active?'نشط':'مخفي'}</span></div>
                <div>الفئة: ${catsMap[p.categoryId]||'غير محدد'} | الرمز: ${p.code||'غير محدد'}</div><div class="product-date"><i class="far fa-clock"></i> ${formatDate(p.createdAt)}</div>
                <div class="flex-start mt-2"><button class="btn btn-secondary btn-sm" onclick="editGlobalProduct('${p.id}')">تعديل</button><button class="btn btn-primary btn-sm" onclick="toggleProduct('${p.id}')"><i class="fas fa-eye${p.active?'-slash':''}"></i> ${p.active?'إخفاء':'إظهار'}</button><button class="btn btn-danger btn-sm" onclick="deleteProduct('${p.id}')">حذف</button></div>
                <div id="globalEdit_${p.id}" style="display:none; margin-top:12px; background:#FFF5F7; padding:12px; border-radius:18px;">
                    <div class="file-upload-btn" onclick="document.getElementById('globalImg_${p.id}').click()"><i class="fas fa-cloud-upload-alt"></i> تغيير الصورة</div><input type="file" id="globalImg_${p.id}" style="display:none">
                    <input type="text" id="gName_${p.id}" value="${p.name}"><input type="text" id="gPrice_${p.id}" value="${p.price}"><input type="text" id="gOld_${p.id}" value="${p.oldprice||''}"><textarea id="gDesc_${p.id}" rows="2">${p.desc||''}</textarea><input type="text" id="gCode_${p.id}" value="${p.code||''}">
                    <div class="flex-start mt-2"><button class="btn btn-primary btn-sm" onclick="updateGlobalProductImage('${p.id}')">حفظ الصورة</button><button class="btn btn-primary btn-sm" onclick="updateGlobalProductData('${p.id}')">حفظ البيانات</button></div>
                </div>
            </div>
        `).join('');
        products.forEach(p=>{ const fi=document.getElementById(`globalImg_${p.id}`); if(fi) fi.onchange=(e)=>{ tempEditProductFile[p.id]=e.target.files[0]; showToast("تم اختيار صورة جديدة"); }; });
    }

    function renderAll() {
        if (currentUserRole === 'super') renderAds();
        renderCategories();
        renderFilteredProducts();
    }

    // دوال الإعلانات (تتحقق من الصلاحية)
    window.toggleAd = async (id) => { if (currentUserRole !== 'super') return showToast("غير مصرح", true); const ad=ads.find(a=>a.id===id); ad.active=!ad.active; await saveAll('adsContent'); };
    window.deleteAd = async (id) => { if (currentUserRole !== 'super') return; ads=ads.filter(a=>a.id!==id); await saveAll('adsContent'); };
    window.showEditAd = (id) => { if (currentUserRole !== 'super') return; document.getElementById(`editAd_${id}`).style.display = 'block'; };
    window.updateAdImage = async (id) => { if (currentUserRole !== 'super') return; if(!tempEditAdFile){ showToast("اختر صورة",true); return; } const url=await uploadImageToCloudinary(tempEditAdFile); const ad=ads.find(a=>a.id===id); ad.image=url; await saveAll('adsContent'); tempEditAdFile=null; showToast("تم تحديث الصورة"); };
    window.updateAdText = async (id) => { if (currentUserRole !== 'super') return; const ad=ads.find(a=>a.id===id); ad.text=document.getElementById(`editAdTxt_${id}`).value; await saveAll('adsContent'); showToast("تم حفظ النص"); };

    // دوال الفئات والمنتجات (لجميع الأدمن)
    window.openEditCatForm = (id) => { document.getElementById(`editCatForm_${id}`).classList.add('open'); };
    window.closeEditCatForm = (id) => { document.getElementById(`editCatForm_${id}`).classList.remove('open'); };
    window.updateCategory = async (id) => {
        const newName = document.getElementById(`editCatName_${id}`).value.trim();
        if(!newName) return showToast("اسم الفئة مطلوب", true);
        const cat = categories.find(c=>c.id===id);
        cat.name = newName;
        if(tempEditCatFile) { cat.image = await uploadImageToCloudinary(tempEditCatFile); tempEditCatFile = null; }
        await saveAll('categoriesContent');
        closeEditCatForm(id);
        showToast("تم تعديل الفئة");
    };
    window.toggleCategory = async (id) => { const cat=categories.find(c=>c.id===id); cat.active=!cat.active; await saveAll('categoriesContent'); };
    window.deleteCategory = async (id) => { if(confirm("سيتم حذف كل منتجاتها")){ categories=categories.filter(c=>c.id!==id); products=products.filter(p=>p.categoryId!==id); await saveAll('categoriesContent'); } };
    window.toggleCatProducts = (id) => { const area=document.getElementById(`catProducts_${id}`); const icon=document.getElementById(`toggleIcon_${id}`); if(area.classList.contains('open')){ area.classList.remove('open'); icon.style.transform='rotate(0deg)'; }else{ area.classList.add('open'); icon.style.transform='rotate(180deg)'; } };
    window.addProductToCategory = async (catId) => {
        const name = document.getElementById(`prodName_${catId}`).value.trim();
        const price = document.getElementById(`prodPrice_${catId}`).value.trim();
        if(!name || !price) return showToast("الاسم والسعر مطلوبان", true);
        const file = tempProductImageFile[catId];
        if(!file) return showToast("اختر صورة للمنتج", true);
        const oldprice = document.getElementById(`prodOld_${catId}`).value.trim();
        const desc = document.getElementById(`prodDesc_${catId}`).value.trim();
        let code = document.getElementById(`prodCode_${catId}`).value.trim();
        if(!code) code = generateProductCode();
        const loader = document.getElementById(`uploadLoader_${catId}`);
        const btn = event.target;
        loader.style.display = 'block';
        btn.disabled = true;
        try {
            const imageUrl = await uploadImageToCloudinary(file);
            const newProduct = { id: Date.now().toString(), name, price, oldprice, desc, image: imageUrl, categoryId: catId, active: true, code, createdAt: Date.now() };
            products.push(newProduct);
            await saveAll(null);
            delete tempProductImageFile[catId];
            document.getElementById(`prodFileName_${catId}`).innerHTML = '📷 لم يتم اختيار ملف';
            document.getElementById(`prodName_${catId}`).value = '';
            document.getElementById(`prodPrice_${catId}`).value = '';
            document.getElementById(`prodOld_${catId}`).value = '';
            document.getElementById(`prodDesc_${catId}`).value = '';
            document.getElementById(`prodCode_${catId}`).value = '';
            document.getElementById(`prodImgFile_${catId}`).value = '';
            const prodsContainer = document.getElementById(`prodsList_${catId}`);
            const catProducts = products.filter(p => p.categoryId === catId);
            prodsContainer.innerHTML = catProducts.map(p => `...`).join('');
            showToast("✅ تمت الإضافة بنجاح");
        } catch(err) { showToast("خطأ: "+err.message, true); }
        loader.style.display = 'none';
        btn.disabled = false;
    };
    window.editProduct = (id) => { document.getElementById(`editForm_${id}`).style.display = 'block'; };
    window.updateProductImage = async (id) => { if(!tempEditProductFile[id]) return showToast("اختر صورة",true); const url=await uploadImageToCloudinary(tempEditProductFile[id]); const prod=products.find(p=>p.id===id); prod.image=url; await saveAll(null); delete tempEditProductFile[id]; document.getElementById(`editForm_${id}`).style.display='none'; showToast("تم تحديث الصورة"); };
    window.updateProductData = async (id) => { const prod=products.find(p=>p.id===id); prod.name=document.getElementById(`editName_${id}`).value; prod.price=document.getElementById(`editPrice_${id}`).value; prod.oldprice=document.getElementById(`editOld_${id}`).value; prod.desc=document.getElementById(`editDesc_${id}`).value; let nc=document.getElementById(`editCode_${id}`).value.trim(); if(nc) prod.code=nc; await saveAll(null); document.getElementById(`editForm_${id}`).style.display='none'; showToast("تم تعديل المنتج"); };
    window.deleteProduct = async (id) => { products=products.filter(p=>p.id!==id); await saveAll(null); showToast("تم الحذف"); };
    window.toggleProduct = async (id) => { const prod=products.find(p=>p.id===id); prod.active=!prod.active; await saveAll(null); };
    window.editGlobalProduct = (id) => { document.getElementById(`globalEdit_${id}`).style.display = 'block'; };
    window.updateGlobalProductImage = async (id) => { if(!tempEditProductFile[id]) return showToast("اختر صورة",true); const url=await uploadImageToCloudinary(tempEditProductFile[id]); const prod=products.find(p=>p.id===id); prod.image=url; await saveAll('allProductsContent'); delete tempEditProductFile[id]; showToast("تم تحديث الصورة"); };
    window.updateGlobalProductData = async (id) => { const prod=products.find(p=>p.id===id); prod.name=document.getElementById(`gName_${id}`).value; prod.price=document.getElementById(`gPrice_${id}`).value; prod.oldprice=document.getElementById(`gOld_${id}`).value; prod.desc=document.getElementById(`gDesc_${id}`).value; let nc=document.getElementById(`gCode_${id}`).value.trim(); if(nc) prod.code=nc; await saveAll('allProductsContent'); document.getElementById(`globalEdit_${id}`).style.display='none'; showToast("تم تعديل المنتج"); };

    async function loadData() {
        try {
            const [adsSnap, catSnap, prodSnap] = await Promise.all([
                db.ref('ads').once('value'),
                db.ref('categories').once('value'),
                db.ref('products').once('value')
            ]);
            ads = adsSnap.val() ? Object.keys(adsSnap.val()).map(k=>({id:k, ...adsSnap.val()[k]})) : [];
            categories = catSnap.val() ? Object.keys(catSnap.val()).map(k=>({id:k, ...catSnap.val()[k]})) : [];
            products = prodSnap.val() ? Object.keys(prodSnap.val()).map(k=>({id:k, ...prodSnap.val()[k]})) : [];
            renderAll();
            document.getElementById('searchAllProducts')?.addEventListener('input', (e) => { lastSearchText = e.target.value; renderFilteredProducts(); });
        } catch(err) { console.error(err); showToast("خطأ في تحميل البيانات", true); }
    }

    auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
    auth.onAuthStateChanged(async (user) => {
        if (!user) { window.location.href = 'login-9k2F7dL3xP1qZ8mW.html'; return; }
        try {
            const roleSnap = await db.ref(`admins/${user.uid}/role`).once('value');
            const role = roleSnap.val();
            if (role === 'super') {
                currentUserRole = 'super';
                const adsSection = document.getElementById('adsSection');
                if (adsSection) adsSection.style.display = 'block';
            } else {
                currentUserRole = 'admin';
                const adsSection = document.getElementById('adsSection');
                if (adsSection) adsSection.style.display = 'none';
                const msgDiv = document.createElement('div');
                msgDiv.className = 'permission-message';
                msgDiv.innerHTML = '<i class="fas fa-info-circle"></i> صلاحياتك محدودة: يمكنك إدارة المنتجات والفئات فقط. الإعلانات غير متاحة.';
                document.querySelector('.container').insertBefore(msgDiv, document.querySelector('.container').firstChild);
                setTimeout(() => msgDiv.remove(), 5000);
            }
            await loadData();
        } catch (err) {
            console.error(err);
            currentUserRole = 'admin';
            const adsSection = document.getElementById('adsSection');
            if (adsSection) adsSection.style.display = 'none';
            await loadData();
        }
    });
    document.getElementById('logoutBtn').onclick = () => auth.signOut().then(() => window.location.href = 'login-9k2F7dL3xP1qZ8mW.html');

    document.getElementById('addCategoryBtn').onclick = async () => {
        const name = document.getElementById('newCatName').value.trim();
        const fileInput = document.getElementById('newCatImageFile');
        if(!name || !fileInput.files.length) return showToast("اسم الفئة وصورة مطلوبان", true);
        const loader = document.getElementById('newCatLoader');
        loader.style.display = 'block';
        try {
            const url = await uploadImageToCloudinary(fileInput.files[0]);
            categories.push({ id: Date.now().toString(), name, image: url, active: true });
            await saveAll('categoriesContent');
            document.getElementById('newCatName').value = '';
            fileInput.value = '';
            document.getElementById('newCatFileName').innerHTML = '📁 لم يتم اختيار ملف';
            showToast("تمت إضافة الفئة");
        } catch(err) { showToast(err.message, true); }
        loader.style.display = 'none';
    };
    document.getElementById('newCatImageFile').onchange = (e) => { document.getElementById('newCatFileName').innerHTML = `📁 ${e.target.files[0]?.name || ''}`; };
    document.getElementById('addAdBtn').onclick = async () => {
        if (currentUserRole !== 'super') return showToast("غير مصرح لك", true);
        const fileInput = document.getElementById('newAdImageFile');
        if(!fileInput.files.length) return showToast("اختر صورة للإعلان", true);
        const text = document.getElementById('newAdText').value;
        const loader = document.getElementById('newAdLoader');
        loader.style.display = 'block';
        try {
            const url = await uploadImageToCloudinary(fileInput.files[0]);
            ads.push({ id: Date.now().toString(), image: url, text: text || '', active: true });
            await saveAll('adsContent');
            fileInput.value = '';
            document.getElementById('newAdFileName').innerHTML = '📁 لم يتم اختيار ملف';
            document.getElementById('newAdText').value = '';
            showToast("تمت إضافة الإعلان");
        } catch(err) { showToast(err.message, true); }
        loader.style.display = 'none';
    };
    document.getElementById('newAdImageFile').onchange = (e) => { document.getElementById('newAdFileName').innerHTML = `📁 ${e.target.files[0]?.name || ''}`; };
</script>
</body>
</html>
